<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{% include '_head.html' %}
    <title>Warnings and errors · Prefix Map</title>
</head>
<body class="doc-page">
{% include '_topbar.html' %}
<main class="page-main">
    <div class="page-head">
        <div>
            <h1>Warnings and errors</h1>
            <div class="sub">Latest first; kept in memory since the process started</div>
        </div>
    </div>
    <div class="card" id="log-container">
        {% for line in logs %}
        <div class="log {{ 'ERROR' if 'ERROR' in line else 'WARNING' if 'WARNING' in line else '' }}">{{ line }}</div>
        {% else %}
        <div class="empty">No warnings or errors.</div>
        {% endfor %}
    </div>
</main>
</body>
</html>
