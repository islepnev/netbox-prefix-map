<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{% include '_head.html' %}
    <title>{{ t('errors.title') }} · {{ t('app.name') }}</title>
</head>
<body class="doc-page">
{% include '_topbar.html' %}
<main class="page-main">
    <div class="page-head">
        <div>
            <h1>{{ t('errors.title') }}</h1>
            <div class="sub">{{ t('errors.subtitle') }}</div>
        </div>
    </div>
    <div class="card" id="log-container">
        {% for line in logs %}
        <div class="log {{ 'ERROR' if 'ERROR' in line else 'WARNING' if 'WARNING' in line else '' }}">{{ line }}</div>
        {% else %}
        <div class="empty">{{ t('errors.empty') }}</div>
        {% endfor %}
    </div>
</main>
</body>
</html>
